<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Status Dashboard</title>
<meta name="description" content="Internal unit status dashboard — sample/dummy data.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-badge">U</div>
      <div class="brand-text">
        <div class="name">Sample Field Artillery Regiment</div>
        <div class="sub">Unit Status Dashboard</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <button class="hamburger" id="hamburgerBtn">&#9776; Menu</button>
        <h1 id="page-title">Overview</h1>
        <div class="meta" id="page-meta"></div>
      </div>
      <div class="actions">
        <button class="btn" id="printBtn" title="Print or export this view as PDF">&#128424; Print / PDF</button>
        <button class="btn" id="exportBtn" title="Download all data as a JSON file">&#8681; Export JSON</button>
        <label class="btn" for="importInput" title="Load a previously exported JSON file" style="cursor:pointer;">
          &#8679; Import JSON
        </label>
        <input type="file" id="importInput" accept="application/json" style="display:none;">
        <button class="btn btn-danger" id="resetBtn" title="Reset to sample data">Reset Sample Data</button>
        <button class="btn" id="cancelEditBtn" style="display:none;">Cancel</button>
        <button class="btn" id="editToggleBtn">Edit Mode</button>
      </div>
    </div>

    <div id="content"></div>

    <div class="footer-note">
      Internal use only. All figures shown are sample/dummy data unless replaced by unit personnel.
      See <code>dashboard/README.md</code> for update &amp; hosting instructions.
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
